<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs — Sistema de Automação</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">Sistema<span>Automação</span></div>
            <nav id="sidebar-nav" class="sidebar-nav"></nav>
        </aside>

        <div class="app-main">
            <header class="topbar">
                <h1 id="page-title">Jobs</h1>
                <div class="topbar-user">
                    <span id="current-role" class="role-tag"></span>
                    <button id="logout-btn" class="btn btn-ghost" type="button">Sair</button>
                </div>
            </header>

            <main class="content">
                <div id="jobs-alert" class="alert" hidden></div>

                <section class="toolbar">
                    <span></span>
                    <button type="button" id="refresh-jobs-btn" class="btn btn-secondary">Atualizar</button>
                </section>

                <section id="job-form-section" class="panel" hidden>
                    <h2>Atualizar Job</h2>
                    <form id="job-form">
                        <input type="hidden" id="job-id">

                        <label for="job-status">Status</label>
                        <select id="job-status" required>
                            <option value="PENDENTE">Pendente</option>
                            <option value="PROCESSANDO">Processando</option>
                            <option value="CONCLUIDO">Concluído</option>
                            <option value="ERRO">Erro</option>
                        </select>

                        <label for="job-iniciado-em">Data de início</label>
                        <input type="datetime-local" id="job-iniciado-em">

                        <label for="job-finalizado-em">Data de fim</label>
                        <input type="datetime-local" id="job-finalizado-em">

                        <label for="job-resultado">Resultado</label>
                        <input type="text" id="job-resultado" placeholder="Descrição do resultado, se concluído">

                        <label for="job-erro">Erro</label>
                        <input type="text" id="job-erro" placeholder="Mensagem de erro, se houver">

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" id="cancel-job-btn" class="btn btn-ghost">Cancelar</button>
                        </div>
                    </form>
                </section>

                <section class="panel">
                    <div style="overflow-x:auto">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th>Automação</th>
                                    <th>Cliente</th>
                                    <th>Criado em</th>
                                    <th>Início</th>
                                    <th>Fim</th>
                                    <th>Resultado</th>
                                    <th>Erro</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="jobs-tbody">
                                <tr><td colspan="9" class="empty-state">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script type="module" src="../js/jobs.js"></script>
</body>
</html>
